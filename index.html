<script>
const L={skin:L_skin,muscle:L_muscle,organ:L_organ,nerve:L_nerve,vessel:L_vessel,bone:L_bone};
function bedah(v){v=+v; L.skin.style.opacity=v<20?1-v/20:0; L.muscle.style.opacity=v<20?v/20:v<40?1:1-(v-40)/20; L.organ.style.opacity=v<30?0:v<55?(v-30)/25:v<75?1:1-(v-75)/15; L.nerve.style.opacity=v<60?0:v<75?(v-60)/15:1; L.vessel.style.opacity=v<70?0:v<85?(v-70)/15:1; L.bone.style.opacity=0.15+v/100*0.85; let idx=v<20?0:v<40?1:v<60?2:v<75?3:v<90?4:5; document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); document.getElementById('c'+idx).classList.add('on');}
function go(v){depth.value=v;bedah(v)} bedah(0);

// BANK 50 SOAL UTBK VERIFIED
const bank=[
{q:"Jumlah tulang dewasa & bayi menurut Gray's Anatomy?",opts:["206 dewasa, 270 bayi (fusi)","208 dewasa, 300 bayi","206 dewasa, 206 bayi","213 dewasa, 270 bayi"],ans:0,exp:"Gray's: 206 distinct bones dewasa (axial 80 + appendicular 126). Bayi ~270 tulang rawan, fusi sacrum 5->1, coccyx 3-5->1.",src:"Gray's Anatomy 42nd Ed, axial 80 + appendicular 126 = 206"},
{q:"Os femoris panjang rata-rata & % tinggi badan?",opts:["~50cm, ~26% tinggi, tulang terpanjang & terkuat","~30cm, ~15% tinggi","~60cm, ~35% tinggi","~40cm, ~20% tinggi"],ans:0,exp:"Studi 1077 limbs: mean femoral length 50.0cm ±7.2, tibial 39cm. Femur ~26% height, tahan 770-1130kg tekan.",src:"Seminar: mean femoral 50cm, tibial 39cm. Testbook: femur 26% height"},
{q:"Costae vera, spuria, fluctuantes?",opts:["I-VII vera langsung ke sternum, VIII-X spuria tidak langsung, XI-XII fluctuantes bebas","Semua langsung ke sternum","I-XII semua melayang","Hanya I-V vera"],ans:0,exp:"Vera I-VII cartilago costalis langsung ke sternum. Spuria VIII-X menyatu ke costa di atas. Fluctuantes XI-XII ujung bebas.",src:"Tortora Principles of Anatomy - Thorax"},
{q:"Fraktur collum femoris risiko apa & kenapa?",opts:["AVN caput karena a.circumflexa femoris medialis robek","Infeksi saja","Tidak ada risiko","Patah patella"],ans:0,exp:"Collum femoris disuplai a.circumflexa femoris medialis (retinacular). Fraktur = suplai putus => avaskular nekrosis caput femoris.",src:"Gray's Anatomy - Hip joint blood supply"},
{q:"Diameter aorta ascendens & tekanan normal?",opts:["2.5-3.5cm, 120/80 mmHg","1cm, 90/60","5cm, 200/100","0.5cm, 120/80"],ans:0,exp:"Aorta ascendens 2.5-3.5cm. Tekanan normal sistolik 120, diastolik 80 mmHg. Media kaya elastin untuk Windkessel effect.",src:"Guyton Hall - Aorta compliance"},
{q:"VCS & VCI dibentuk dari apa & panjang VCI?",opts:["VCS dari vv.brachiocephalica, VCI dari vv.iliaca communis, panjang VCI ~22cm diam 1.5-2.5cm","Keduanya dari atrium","VCI 5cm","VCS dari aorta"],ans:0,exp:"VCS: vv.brachiocephalica dex+sin. VCI: vv.iliaca communis, panjang 22cm, diameter 1.5-2.5cm, tidak punya katup.",src:"Anatomy textbook - Great veins"},
{q:"Total panjang sistem vaskular manusia?",opts:["~100.000km = 2.5x keliling bumi","~10km","~1000km","~1.000.000km"],ans:0,exp:"Arteri + vena + kapiler ~100.000km. Kapiler diameter 5-10 mikron, tempat pertukaran.",src:"Guyton Hall - Vascular length"},
{q:"Medulla spinalis berakhir di mana & lumbal puncture di mana?",opts:["Conus medullaris L1-L2, puncture L3-L4 / L4-L5","Berakhir di sacrum, puncture di cervical","Berakhir di L5, puncture di thoracal","Berakhir di otak"],ans:0,exp:"Medulla berakhir conus di L1-L2, lanjut cauda equina. LP di L3-L4 atau L4-L5 interspinosus untuk hindari cedera medulla.",src:"Snell Neuroanatomy - Spinal cord"},
{q:"Kecepatan konduksi A-alpha & fungsi refleks patella?",opts:["70-120 m/s, arcus reflexus L2-L4 tanpa cortex","1 m/s, lewat cortex","10 m/s","200 m/s"],ans:0,exp:"Serabut A-alpha 70-120 m/s (myelinated besar). Refleks patella L2-L4: sensorik -> interneuron -> motorik di medulla, tanpa ke cortex, makanya cepat.",src:"Guyton Hall - Nerve conduction"},
{q:"Encephalon berat, % O2 & % glukosa?",opts:["~1400gr (2% BB) tapi 20% O2 & 25% glukosa","10% BB 50% O2","500gr 5% O2","2000gr 10% O2"],ans:0,exp:"Otak 2% berat badan tapi konsumsi O2 20% & glukosa 25% tubuh. ATP hampir eksklusif dari glukosa (tidak simpan glikogen banyak).",src:"Kandel Neuroscience - Brain metabolism"},
{q:"Potensial istirahat neuron & ion utama?",opts:["-70mV, K+ tinggi intrasel, Na+ tinggi ekstrasel, aksi potensial via Na+ influx","-10mV","0mV","+70mV"],ans:0,exp:"Resting -70mV karena K+ leak & Na+/K+ ATPase (3 Na+ keluar, 2 K+ masuk). Aksi potensial: Na+ channel buka -> depolarisasi -> K+ keluar repolarisasi.",src:"Guyton Hall - Membrane potential"},
{q:"Neurotransmitter eksitasi & inhibisi utama?",opts:["Glutamat eksitasi, GABA inhibisi","GABA eksitasi, glutamat inhibisi","Dopamin eksitasi utama","Serotonin eksitasi utama"],ans:0,exp:"Glutamat ~75% sinaps eksitasi di CNS (via AMPA/NMDA). GABA ~25% inhibisi (via GABA-A Cl- influx).",src:"Kandel - Neurotransmitter"},
{q:"BBB dibentuk oleh?",opts:["Tight junction endotel kapiler + astrosit foot process + perisit","Hanya tengkorak","Hanya dura","Tidak ada BBB"],ans:0,exp:"Blood-brain barrier: tight junction antar endotel, basal lamina, perisit, astrosit foot. Lindungi otak dari toksin, tapi obat sulit masuk.",src:"Neuroscience textbook"},
{q:"Pulmo dexter vs sinister lobus & segmentum?",opts:["Dexter 3 lobus (sup, med, inf) 10 segmen, sinister 2 lobus + lingula 9 segmen","Keduanya 2 lobus","Keduanya 3 lobus","Dexter 2, sinister 3"],ans:0,exp:"Kanan 3 lobus karena fissura horizontalis + obliqua, kiri 2 lobus. Segmentum bronchopulmonale kanan 10, kiri 9-10.",src:"West Respiratory Physiology"},
{q:"Alveolus jumlah & luas, tebal membran respiratorik?",opts:["300-500 juta, luas 70-100m², membran 0.5 mikron","100 juta, 10m²","1 miliar, 200m²","50 juta, 20m²"],ans:0,exp:"Alveoli 300-500 juta, luas 70-100m² (lapangan tenis). Membran: pneumosit I + basal lamina + endotel = 0.5 mikron tipis untuk difusi O2/CO2.",src:"Tortora - Respiratory membrane"},
{q:"Surfaktan apa & fungsi?",opts:["DPPC (dipalmitoylphosphatidylcholine) dari pneumosit II, turunkan surface tension cegah kolaps","Protein saja","Hanya air","Mukus"],ans:0,exp:"Surfaktan = DPPC + protein SP-A,B,C,D dari pneumosit tipe II. Turunkan tegangan permukaan alveolus, cegah kolaps saat ekspirasi, cegah edema.",src:"West - Surfactant"},
{q:"Bronchus principalis dex kenapa aspirasi lebih sering kanan?",opts:["Lebih pendek, lebar, vertikal (~25° dari trakea)","Lebih panjang","Lebih sempit","Sama saja"],ans:0,exp:"Bronchus dex: panjang 2.5cm, lebar, sudut 25° dari vertikal. Sin: panjang 5cm, sudut 45°. Jadi benda asing cenderung jatuh kanan.",src:"Gray's Anatomy - Bronchi"},
{q:"Cor 4 ruang & katup urutan aliran?",opts:["VCS/VCI -> atrium dex -> tricuspidalis -> ventriculus dex -> pulmonalis -> pulmo -> vv.pulmonales -> atrium sin -> mitralis -> ventriculus sin -> aortae -> aorta","Langsung aorta","Atrium sin dulu","Tidak ada katup"],ans:0,exp:"Sirkulasi: kanan = pulmonal (darah kotor ke paru), kiri = sistemik (darah bersih ke tubuh). Katup cegah regurgitasi.",src:"Guyton Hall - Heart chambers"},
{q:"Sistem konduksi jantung & pacemaker?",opts:["SA node 60-100/menit (pacemaker) -> AV delay 0.1s -> His -> Purkinje","Hanya Purkinje","AV node pacemaker utama","His pacemaker"],ans:0,exp:"SA node di atrium dex dekat VCS = pacemaker normal 60-100. AV node delay 0.1s untuk atrium kontraksi dulu. His & Purkinje cepat 2-3 m/s.",src:"Guyton Hall - Conduction system"},
{q:"Cardiac output rumus & normal?",opts:["CO = SV (70ml) x HR (70) = ~5L/menit","CO = 1L/menit","CO = 20L/menit","CO = HR saja"],ans:0,exp:"Stroke volume ~70ml, HR ~70 => CO 4.9-5L/menit istirahat. Exercise bisa 20-25L/menit.",src:"Guyton Hall - Cardiac output"},
{q:"Suplai darah jantung & infark tersering?",opts:["aa.coronaria dex & sin dari sinus Valsalva, infark tersering LAD (a.coronaria sin ramus interventricularis anterior)","Dari VCI","Dari aorta descendens","Dari VCS"],ans:0,exp:"Coronaria dari aorta ascendens sinus Valsalva. LAD suplai anterior & septum, paling sering aterosklerosis -> infark anterior.",src:"Robbins Pathology - Coronary"},
{q:"EKG P, QRS, T?",opts:["P=depolarisasi atrium, QRS=depolarisasi ventriculus, T=repolarisasi ventriculus","Semua depolarisasi","P=ventriculus","T=atrium"],ans:0,exp:"P wave atrium depolarisasi, QRS ventriculus depolarisasi (0.08-0.10s), T repolarisasi ventriculus. Atrium repolarisasi tertutup QRS.",src:"Guyton Hall - ECG"},
{q:"Marker infark miokard?",opts:["Troponin I/T (spesifik), CK-MB","Hanya hemoglobin","Leukosit","Gula darah"],ans:0,exp:"Troponin I/T spesifik miokard, naik 3-6 jam post infark, puncak 24 jam, normal 7-10 hari. CK-MB naik 4-6 jam.",src:"Robbins - MI markers"},
{q:"Hepar berat, segmen Couinaud, vaskularisasi?",opts:["1.2-1.5kg, 8 segmen, 75% v.portae + 25% a.hepatica propria","500gr, 4 segmen","2kg, 2 segmen","1kg, 75% arteri"],ans:0,exp:"Hepar 8 segmen Couinaud berdasarkan v.portae. 75% darah dari v.portae (nutrien usus), 25% dari a.hepatica (O2). Trias: portae, hepatica, choledocus.",src:"Gray's Anatomy - Liver"},
{q:"Fungsi hepar metabolisme & bilirubin?",opts:["Karbo (glikogenesis, glikogenolisis, glukoneogenesis), protein (albumin, faktor koagulasi), lemak, detoks CYP450, bilirubin indirect -> direct via glukuronidasi","Hanya simpan lemak","Hanya buat empedu","Tidak ada fungsi"],ans:0,exp:"Hepar 500+ fungsi. Bilirubin indirect hidrofobik bound albumin -> hepar konjugasi glucuronate -> direct hidrofilik -> empedu -> usus.",src:"Guyton Hall - Liver functions"},
{q:"Empedu volume & AST/ALT?",opts:["500-1000ml/hari, AST/ALT marker hepatoseluler, ALP/bilirubin kolestasis","100ml/hari","5000ml/hari","Tidak buat empedu"],ans:0,exp:"Empedu 500-1000ml/hari, garam empedu untuk emulsi lemak. AST/ALT naik jika hepatosit rusak, ALP naik jika kolestasis.",src:"Robbins - Liver enzymes"},
{q:"Regenerasi hepar & sirosis?",opts:["Bisa regrow 70% reseksi (hepatosit masuk G1), sirosis = fibrosis + nodul regeneratif + hipertensi porta","Tidak bisa regenerasi","Sirosis = normal","Regenerasi 10% saja"],ans:0,exp:"Hepar bisa regenerasi hingga 70% reseksi karena hepatosit quiescent bisa masuk siklus. Sirosis: fibrosis difus + nodul, tekanan porta naik, varises.",src:"Robbins - Liver regeneration"},
{q:"Gaster kapasitas, sel & pH?",opts:["1-1.5L (bisa 4L), chief pepsinogen, parietal HCl pH 1.5-3.5 + faktor intrinsik B12, mukus HCO3- proteksi","Kapasitas 100ml pH 7","Tidak ada HCl","Hanya chief saja"],ans:0,exp:"Gaster fundus, corpus, pars pylorica. Chief: pepsinogen -> pepsin aktif pH 1.5-2.5. Parietal: HCl & IF B12. G cell: gastrin. Mukus + HCO3- proteksi.",src:"Tortora - Stomach"},
{q:"Turnover mukosa gaster & ulkus?",opts:["Mukosa ganti 3-6 hari, ulkus duodenum 90% H.pylori, gaster NSAID","Turnover 1 tahun","Ulkus karena makan pedas saja","Tidak ada ulkus"],ans:0,exp:"Mukosa cepat regenerasi 3-6 hari. Ulkus peptikum: duodenum paling sering H.pylori, gaster NSAID (hambat prostaglandin proteksi). HCl volume 2-5L/hari.",src:"Robbins - Peptic ulcer"},
{q:"Ren nefron & GFR?",opts:["~1-1.2 juta nefron/ginjal, GFR 90-120ml/menit, filtrasi 180L/hari -> urin 1-2L (99% reabsorpsi)","100 nefron","GFR 10ml/menit","Filtrasi 1L/hari"],ans:0,exp:"Tiap ginjal ~1 juta nefron. Glomerulus filtrasi 180L/hari, tubulus reabsorpsi 99% jadi urin 1-2L. GFR normal 90-120ml/menit.",src:"Guyton Hall - GFR"},
{q:"Regulasi ginjal ADH, Aldosteron, RAAS?",opts:["ADH reabsorpsi air di koligens, Aldosteron reabsorpsi Na+ sekresi K+, RAAS atur tekanan, EPO buat eritrosit, vit D kalsitriol","Tidak ada regulasi","Hanya ADH","Hanya EPO"],ans:0,exp:"ADH dari hipofisis posterior, Aldosteron dari adrenal, RAAS: renin dari juxtaglomerular -> angiotensin II vasokonstriksi + Aldosteron, ANP lawan.",src:"Guyton Hall - Kidney regulation"},
{q:"Posisi ginjal kanan vs kiri & hilum?",opts:["Kanan lebih rendah 1-2cm karena hepar, hilum: v.renalis anterior, a.renalis tengah, ureter posterior","Kiri lebih rendah","Sama tinggi","Hilum hanya ureter"],ans:0,exp:"Ginjal kanan lebih rendah karena hepar di atasnya. Hilum urutan V-A-U dari depan ke belakang. Kreatinin marker filtrasi.",src:"Gray's Anatomy - Kidney"},
{q:"Jenis otot 3 & perbedaan?",opts:["Skeletal: lurik multinukleus voluntary NMJ asetilkolin, Cardiac: lurik bercabang involuntary discus intercalaris, Smooth: polos spindle involuntary calmodulin","Semua sama","Hanya skeletal","Skeletal involuntary"],ans:0,exp:"Skeletal: voluntary, sarkomer aktin-miosin sliding. Cardiac: involuntary, gap junction. Smooth: involuntary viscera & pembuluh, calmodulin bukan troponin.",src:"Tortora - Muscle types"},
{q:"Sarkomer & sliding filament?",opts:["Z-disc ke Z-disc, A-band miosin, I-band aktin, Ca2+ dari SR -> troponin -> tropomiosin geser -> cross-bridge + ATP","Tidak ada aktin","Hanya miosin","Tanpa Ca2+"],ans:0,exp:"Ca2+ dari sarkoplasmik retikulum ikat troponin C -> tropomiosin geser buka binding site aktin -> miosin head + ATP -> kontraksi.",src:"Guyton Hall - Muscle contraction"},
{q:"Tipe serat otot & otot terkecil/terkuat?",opts:["Tipe I slow oxidative merah tahan lelah, IIa & IIx fast, terkecil m.stapedius 1mm, terkuat m.masseter 70-90kg/cm²","Semua fast","Terkecil masseter","Terkuat stapedius"],ans:0,exp:"Tipe I mitokondria banyak, myoglobin merah. Tipe IIx putih cepat lelah. Masseter tekanan gigitan terkuat, stapedius terkecil di telinga tengah.",src:"Tortora - Fiber types"},
{q:"Integumentum lapisan & sel?",opts:["Epidermis: basale (mitosis melanosit Merkel), spinosum desmosom, granulosum keratohyalin, lucidum telapak, corneum keratin. Dermis papillare Meissner, reticulare kolagen","Hanya epidermis","Hanya dermis","Tidak ada lapisan"],ans:0,exp:"Epidermis 5 stratum. Dermis papillare kapiler & Meissner raba halus, reticulare kolagen I elastin folikel sebacea sudorifera.",src:"Fitzpatrick Dermatology"},
{q:"Melanin & kelenjar keringat?",opts:["Melanosit di basale transfer melanosome
